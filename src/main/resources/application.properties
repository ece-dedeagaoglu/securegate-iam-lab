spring.application.name=securegate

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:securegatedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator Health
management.endpoints.web.exposure.include=health,info

# Security & Policy Configuration
security.jwt.secret=U2VjdXJlR2F0ZUlBTUxhYlplcm9UcnVzdFBvbGljeUVuZ2luZTIwMjZLRVk=
security.jwt.expiration-ms=3600000
security.policy.max-failed-attempts=3
security.policy.ai-agent-risk-threshold=50
security.policy.human-risk-threshold=80
